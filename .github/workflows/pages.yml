name: Deploy site and API

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      deploy_required: ${{ steps.filter.outputs.deploy_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [ -n "$base_sha" ] && [ "$base_sha" != "$zero_sha" ]; then
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed_files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          non_doc_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/|[^/]+\.md$)' || true)"
          if [ -z "$non_doc_files" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          fi

  docs-only:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate documentation diff
        shell: bash
        run: |
          base_sha="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$base_sha" ] && [ "$base_sha" != "$zero_sha" ]; then
            git diff --check "$base_sha" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy_required == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: npm ci

      - run: python3 -m pip install -r requirements.txt

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - run: npm run test:ci
        env:
          CHROME_EXEC: ${{ steps.setup-chrome.outputs.chrome-path }}

  validate-cloudflare-config:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always() && needs.changes.outputs.deploy_required == 'true' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate Cloudflare AI configuration
        run: npm run check:cloudflare-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: validate-cloudflare-config
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare static site
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    needs: validate-cloudflare-config
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare static site
        run: npm run build:site

      - name: Deploy Cloudflare Pages
        run: npm run deploy:cf:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    needs: validate-cloudflare-config
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy Cloudflare Worker
        run: npm run deploy:cf:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
