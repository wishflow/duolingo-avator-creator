<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duolingo Avatar Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Feather Bold', sans-serif; background: #131f2c; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: #1a2d3d; border-bottom: 1px solid #243647; flex-shrink: 0; }
.header h1 { font-size: 20px; font-weight: 800; color: #fff; }
.header-info { font-size: 12px; color: #6b8299; }
.header-actions { display: flex; gap: 10px; }
.btn { padding: 10px 22px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: #58cc02; color: #fff; }
.btn-primary:hover { background: #4cb000; transform: translateY(-1px); }
.btn-secondary { background: #2a4055; color: #b0c8d8; }
.btn-secondary:hover { background: #354f6a; }

/* Main layout: 50/50 split */
.main-layout { display: flex; flex: 1; overflow: hidden; }

/* Left: Avatar preview */
.preview-panel { width: 50%; display: flex; align-items: center; justify-content: center; background: #0f1a24; position: relative; }
.preview-panel canvas { border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); max-width: 90%; max-height: 85%; }
.file-drop-area { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
.file-drop-area input[type="file"] { font-size: 11px; color: #6b8299; width: 200px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: #58cc02; }
.dot.wait { background: #ffc107; }

/* Right: Options panel */
.options-panel { width: 50%; display: flex; flex-direction: column; background: #1a2d3d; border-left: 1px solid #243647; }

/* Icon tab bar */
.tab-bar { display: flex; background: #152536; border-bottom: 2px solid #243647; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
.tab-bar::-webkit-scrollbar { height: 0; }
.tab-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 14px 10px; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; min-width: 56px; }
.tab-btn svg { width: 26px; height: 26px; }
.tab-btn .tab-label { font-size: 11px; font-weight: 600; color: #6b8299; }
.tab-btn:hover .tab-label { color: #b0c8d8; }
.tab-btn:hover svg { opacity: 0.8; }
.tab-btn.active { border-bottom-color: #58cc02; }
.tab-btn.active .tab-label { color: #58cc02; }
.tab-btn.active svg { opacity: 1; }

/* Scrollable sections */
.options-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
.options-scroll::-webkit-scrollbar { width: 4px; }
.options-scroll::-webkit-scrollbar-thumb { background: #2a4055; border-radius: 2px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.section { margin-bottom: 24px; }
.section-header { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; }

/* Color swatches */
.swatch-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 48px; height: 48px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.12s, border-color 0.12s; position: relative; flex-shrink: 0; }
.swatch:hover { transform: scale(1.15); }
.swatch.selected { border-color: #58cc02; box-shadow: 0 0 0 4px rgba(88,204,2,0.25); }
.swatch.selected::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

/* Feature tiles */
.tile-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { width: 96px; height: 96px; border-radius: 14px; cursor: pointer; border: 3px solid #2a4055; background: #1e3347; transition: all 0.12s; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile:hover { border-color: #58cc02; transform: scale(1.06); }
.tile.selected { border-color: #58cc02; box-shadow: 0 0 0 4px rgba(88,204,2,0.3); }
.tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; position: absolute; inset: 0; }
.tile .tile-placeholder { font-size: 32px; opacity: 0.25; z-index: 1; }
.tile.loading .tile-placeholder { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.4; } }

/* Thumb status */
.thumb-status { font-size: 10px; color: #506070; text-align: center; padding: 4px; flex-shrink: 0; min-height: 20px; }

/* Loading */
.loading-overlay { position: fixed; inset: 0; background: rgba(15,26,36,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay.hidden { display: none; }
.spinner { width: 48px; height: 48px; border: 4px solid #2a4055; border-top-color: #58cc02; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #b0c8d8; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">加载 Avatar Builder...</div>
</div>

<div class="header">
  <div>
    <h1>Avatar Builder</h1>
    <div class="header-info" id="fileStatus">等待加载...</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="resetAll()">重置</button>
    <button class="btn btn-primary" onclick="exportPNG()">导出 PNG</button>
  </div>
</div>

<div class="main-layout">
  <!-- LEFT: Avatar preview -->
  <div class="preview-panel">
    <canvas id="riveCanvas" width="500" height="500"></canvas>
    <div class="file-drop-area">
      <div class="dot wait" id="statusDot"></div>
      <input type="file" id="fileInput" accept=".riv" title="选择 .riv 文件">
    </div>
  </div>

  <!-- RIGHT: Options -->
  <div class="options-panel">
    <div class="tab-bar" id="tabBar"></div>
    <div class="thumb-status" id="thumbStatus"></div>
    <div class="options-scroll" id="tabContent"></div>
  </div>
</div>

<canvas id="thumbCanvas" width="150" height="150" style="display:none;"></canvas>

<!-- Tab icon SVGs -->
<svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Body icon -->
    <g id="icon-body"><circle cx="12" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 24c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="13" x2="12" y2="24" stroke="currentColor" stroke-width="2"/></g>
    <!-- Eyes icon -->
    <g id="icon-eyes"><ellipse cx="8" cy="12" rx="3" ry="3.5" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="16" cy="12" rx="3" ry="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="12" r="1.5" fill="currentColor"/><circle cx="16" cy="12" r="1.5" fill="currentColor"/></g>
    <!-- Hair icon -->
    <g id="icon-hair"><path d="M6 14c1-5 5-8 6-8s5 3 6 8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11c2-2 4-3 7-3s5 1 7 3" fill="none" stroke="currentColor" stroke-width="1.5"/></g>
    <!-- Face icon -->
    <g id="icon-face"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/><path d="M8 16c1.5 2 6.5 2 8 0" fill="none" stroke="currentColor" stroke-width="1.5"/></g>
    <!-- Facial hair icon -->
    <g id="icon-beard"><path d="M6 11c0 4 2.7 8 6 8s6-4 6-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 13c1 2 2.5 3 4 3s3-1 4-3" fill="none" stroke="currentColor" stroke-width="1.5"/></g>
    <!-- Headwear icon -->
    <g id="icon-hat"><path d="M4 14h16l-1 6H5l-1-6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 14V9c0-2.8 2.2-5 5-5s5 2.2 5 5v5" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <!-- Clothing icon -->
    <g id="icon-shirt"><path d="M6 6l3-3h6l3 3v14H6V6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v4h6V3" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <!-- Background icon -->
    <g id="icon-bg"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor" opacity="0.3"/><circle cx="16" cy="9" r="3" fill="currentColor" opacity="0.5"/><circle cx="8" cy="15" r="2" fill="currentColor" opacity="0.4"/></g>
  </defs>
</svg>

<script src="https://unpkg.com/@rive-app/canvas@2.37.8/rive.js"></script>
<script>
// ===================== STATE =====================
let riveInst = null;
let thumbRive = null;
let thumbReady = false;
let smNames = [];
let currentSM = '';
let triggerInput = null;
let fireTimeout = null;
let builderConfig = null;
let currentInputValues = {};
let stateMachineInputs = {};
let riveBuffer = null;
let thumbCache = {};

const TAB_ICONS = ['icon-body','icon-eyes','icon-hair','icon-face','icon-beard','icon-hat','icon-shirt','icon-bg'];
const TAB_LABELS = ['Body','Eyes','Hair','Face','Beard','Hat','Shirt','BG'];

// ===================== DOM =====================
const canvas = document.getElementById('riveCanvas');
const thumbCanvas = document.getElementById('thumbCanvas');
const tabBar = document.getElementById('tabBar');
const tabContent = document.getElementById('tabContent');
const loadingOverlay = document.getElementById('loadingOverlay');
const fileStatus = document.getElementById('fileStatus');
const statusDot = document.getElementById('statusDot');
const thumbStatus = document.getElementById('thumbStatus');

// ===================== TRIGGER =====================
function scheduleTrigger() {
  if (!triggerInput) return;
  if (fireTimeout) clearTimeout(fireTimeout);
  fireTimeout = setTimeout(() => { triggerInput.fire(); fireTimeout = null; }, 100);
}

// ===================== MAIN RIVE =====================
function loadRiveFile(buffer) {
  riveBuffer = buffer;
  if (riveInst) { try { riveInst.cleanup(); } catch(e) {} riveInst = null; }
  if (thumbRive) { try { thumbRive.cleanup(); } catch(e) {} thumbRive = null; }
  smNames = []; currentSM = ''; stateMachineInputs = {}; currentInputValues = {};
  thumbCache = {}; thumbReady = false;

  const Rive = window.rive?.Rive;
  if (!Rive) { fileStatus.textContent = '错误: Rive SDK 未加载'; return; }

  fileStatus.textContent = '加载中...';
  riveInst = new Rive({
    canvas, buffer: new Uint8Array(buffer), autoplay: false,
    onLoad: () => onMainLoaded(),
    onLoadError: (err) => fileStatus.textContent = `加载错误: ${err}`,
  });
}

function onMainLoaded() {
  if (!riveInst) return;
  const ab = riveInst.riveFile.file.defaultArtboard();
  smNames = [];
  for (let i = 0; i < ab.stateMachineCount(); i++) smNames.push(ab.stateMachineByIndex(i).name);
  fileStatus.textContent = `${ab.name} · ${smNames.length} 状态机`;
  statusDot.className = 'dot ok';

  riveInst.play(smNames);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      selectStateMachine('SMAvatar');
      initThumbnailRive();
      loadingOverlay.classList.add('hidden');
    });
  });
}

function selectStateMachine(name) {
  if (!riveInst || !name) return;
  currentSM = name;
  const inputs = riveInst.stateMachineInputs(name);
  if (!inputs) { fileStatus.textContent = `无法获取: ${name}`; return; }

  stateMachineInputs = {}; currentInputValues = {}; triggerInput = null;
  for (const inp of inputs) {
    stateMachineInputs[inp.name] = inp;
    if (inp.type === 58) { if (inp.name === 'bounce_trig') triggerInput = inp; }
    else currentInputValues[inp.name] = inp.value;
  }
  if (builderConfig) renderUI();
}

// ===================== VALUE SETTING =====================
function setSMValue(name, value) {
  const inp = stateMachineInputs[name];
  if (!inp) return;
  if (inp.type === 56) inp.value = value;
  else if (inp.type === 59) inp.value = !!value;
  currentInputValues[name] = value;
}

function applyFeatureButton(fb) {
  const primaryState = fb.state;
  for (const [key, val] of Object.entries(fb.statesToOverride)) {
    if (val === 0 && key !== primaryState) continue;
    setSMValue(key, val);
  }
  scheduleTrigger();
}

// ===================== THUMBNAIL RIVE =====================
function initThumbnailRive() {
  if (!riveBuffer) return;
  const Rive = window.rive?.Rive;
  if (!Rive) return;

  thumbRive = new Rive({
    canvas: thumbCanvas,
    buffer: new Uint8Array(riveBuffer),
    autoplay: false,
    onLoad: () => {
      thumbRive.play(smNames);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const inputs = thumbRive.stateMachineInputs('SMAvatar');
          if (inputs) {
            let trig = null;
            for (const inp of inputs) {
              if (inp.type === 58 && inp.name === 'bounce_trig') trig = inp;
              else if (inp.type === 56 && currentInputValues[inp.name] !== undefined) {
                inp.value = currentInputValues[inp.name];
              }
            }
            if (trig) trig.fire();
          }
          thumbReady = true;
          requestAnimationFrame(() => generateVisibleThumbnails());
        });
      });
    },
    onLoadError: () => console.warn('Thumbnail load error'),
  });
}

function captureThumbFor(fb) {
  return new Promise((resolve) => {
    const key = `${fb.state}_${fb.value}`;
    if (thumbCache[key]) { resolve(thumbCache[key]); return; }
    if (!thumbReady || !thumbRive) { resolve(null); return; }

    const inputs = thumbRive.stateMachineInputs('SMAvatar');
    if (!inputs) { resolve(null); return; }

    const nameMap = {};
    let trig = null;
    for (const inp of inputs) {
      nameMap[inp.name] = inp;
      if (inp.type === 58 && inp.name === 'bounce_trig') trig = inp;
      else if (inp.type === 56 && currentInputValues[inp.name] !== undefined) {
        inp.value = currentInputValues[inp.name];
      }
    }

    const primaryState = fb.state;
    for (const [key, val] of Object.entries(fb.statesToOverride)) {
      if (val === 0 && key !== primaryState) continue;
      if (nameMap[key] && nameMap[key].type === 56) nameMap[key].value = val;
    }

    if (trig) trig.fire();

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        try {
          const uri = thumbCanvas.toDataURL('image/png');
          thumbCache[key] = uri;
          resolve(uri);
        } catch(e) { resolve(null); }
      });
    });
  });
}

async function generateVisibleThumbnails() {
  if (!thumbReady || !builderConfig) return;
  const activePanel = tabContent.querySelector('.tab-panel.active');
  if (!activePanel) return;

  const panels = [...tabContent.querySelectorAll('.tab-panel')];
  const activeIdx = panels.indexOf(activePanel);
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  if (activeIdx < 0 || activeIdx >= tabs.length) return;

  const tab = tabs[activeIdx];
  const tileGrids = activePanel.querySelectorAll('.tile-grid');
  let gridIdx = 0;
  const workItems = [];

  for (const section of tab.sections) {
    if (section.buttonType === 'FEATURE' && gridIdx < tileGrids.length) {
      const grid = tileGrids[gridIdx];
      const tiles = grid.querySelectorAll('.tile');
      for (let i = 0; i < section.featureButtons.length; i++) {
        workItems.push({ fb: section.featureButtons[i], tile: tiles[i] || null });
      }
      gridIdx++;
    }
  }

  const pending = workItems.filter(w => !thumbCache[`${w.fb.state}_${w.fb.value}`]);
  if (pending.length === 0) {
    for (const w of workItems) updateTile(w.tile, w.fb);
    return;
  }

  let done = 0;
  thumbStatus.textContent = `生成预览... 0/${pending.length}`;

  for (const w of workItems) {
    const uri = await captureThumbFor(w.fb);
    if (uri) updateTile(w.tile, w.fb);
    const key = `${w.fb.state}_${w.fb.value}`;
    if (thumbCache[key]) { done++; thumbStatus.textContent = `生成预览... ${done}/${pending.length}`; }
  }
  thumbStatus.textContent = '';
}

function updateTile(tile, fb) {
  if (!tile) return;
  const key = `${fb.state}_${fb.value}`;
  const uri = thumbCache[key];
  if (!uri) return;
  tile.classList.remove('loading');
  const ph = tile.querySelector('.tile-placeholder');
  if (ph) ph.style.display = 'none';
  const old = tile.querySelector('img');
  if (old) old.remove();
  const img = document.createElement('img');
  img.src = uri;
  tile.appendChild(img);
}

// ===================== UI RENDER =====================
function renderUI() {
  if (!builderConfig) return;
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;

  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  tabs.forEach((tab, ti) => {
    // Icon tab button
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24"><use href="#${TAB_ICONS[ti] || 'icon-face'}"/></svg><span class="tab-label">${TAB_LABELS[ti] || 'Tab'}</span>`;
    btn.onclick = () => switchTab(ti);
    tabBar.appendChild(btn);

    // Panel
    const panel = document.createElement('div');
    panel.className = 'tab-panel';

    for (const section of tab.sections) {
      const secDiv = document.createElement('div');
      secDiv.className = 'section';
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = section.header;
      secDiv.appendChild(header);

      if (section.buttonType === 'IMAGE') {
        const grid = document.createElement('div');
        grid.className = 'swatch-grid';
        const stateName = section.imageButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const ib of section.imageButtons) {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.dataset.state = ib.state;
          swatch.dataset.value = ib.value;
          if (ib.value === currentVal) swatch.classList.add('selected');
          swatch.style.backgroundColor = ib.color;
          swatch.title = ib.color;
          swatch.onclick = () => {
            setSMValue(ib.state, ib.value);
            scheduleTrigger();
            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          };
          grid.appendChild(swatch);
        }
        secDiv.appendChild(grid);
      } else if (section.buttonType === 'FEATURE') {
        const grid = document.createElement('div');
        grid.className = 'tile-grid';
        const stateName = section.featureButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const fb of section.featureButtons) {
          const tile = document.createElement('div');
          tile.className = 'tile loading';
          tile.dataset.state = fb.state;
          tile.dataset.value = fb.value;
          if (fb.value === currentVal) tile.classList.add('selected');

          const ph = document.createElement('span');
          ph.className = 'tile-placeholder';
          ph.textContent = fb.value === 0 ? '✕' : '';
          tile.appendChild(ph);

          // Show cached immediately
          const cachedUri = thumbCache[`${fb.state}_${fb.value}`];
          if (cachedUri) {
            tile.classList.remove('loading');
            ph.style.display = 'none';
            const img = document.createElement('img');
            img.src = cachedUri;
            tile.appendChild(img);
          }

          tile.onclick = () => {
            applyFeatureButton(fb);
            grid.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
            tile.classList.add('selected');
            refreshAllHighlights();
          };
          grid.appendChild(tile);
        }
        secDiv.appendChild(grid);
      }
      panel.appendChild(secDiv);
    }
    tabContent.appendChild(panel);
  });

  switchTab(0);
  setTimeout(() => generateVisibleThumbnails(), 300);
}

function switchTab(idx) {
  tabBar.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  tabContent.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  setTimeout(() => generateVisibleThumbnails(), 120);
}

function refreshAllHighlights() {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs) return;
  const panels = tabContent.querySelectorAll('.tab-panel');
  panels.forEach((panel, ti) => {
    if (ti >= tabs.length) return;
    const tab = tabs[ti];
    let si = 0, fi = 0;
    const swatchGrids = panel.querySelectorAll('.swatch-grid');
    const tileGrids = panel.querySelectorAll('.tile-grid');
    for (const section of tab.sections) {
      if (section.buttonType === 'IMAGE' && si < swatchGrids.length) {
        const cur = currentInputValues[section.imageButtons[0]?.state];
        swatchGrids[si].querySelectorAll('.swatch').forEach(s => {
          s.classList.toggle('selected', parseInt(s.dataset.value) === cur);
        });
        si++;
      } else if (section.buttonType === 'FEATURE' && fi < tileGrids.length) {
        const cur = currentInputValues[section.featureButtons[0]?.state];
        tileGrids[fi].querySelectorAll('.tile').forEach(t => {
          t.classList.toggle('selected', parseInt(t.dataset.value) === cur);
        });
        fi++;
      }
    }
  });
}

// ===================== ACTIONS =====================
function resetAll() { if (currentSM) selectStateMachine(currentSM); }
function exportPNG() {
  const link = document.createElement('a');
  link.download = `avatar_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ===================== EVENTS =====================
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadRiveFile(await file.arrayBuffer());
});

// ===================== INIT =====================
async function init() {
  try {
    const resp = await fetch('avatar_builder_config.json');
    if (resp.ok) builderConfig = await resp.json();
  } catch(e) { console.warn('Config:', e.message); }

  try {
    const resp = await fetch('avatar_builder_25_sept2025.riv');
    if (resp.ok) {
      loadRiveFile(await resp.arrayBuffer());
    } else {
      fileStatus.textContent = `HTTP ${resp.status}，请手动选择 .riv 文件`;
      loadingOverlay.classList.add('hidden');
    }
  } catch(e) {
    fileStatus.textContent = `请求失败: ${e.message}`;
    loadingOverlay.classList.add('hidden');
  }
}
window.addEventListener('load', init);
</script>
</body>
</html>
