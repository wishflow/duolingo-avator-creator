<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Avatar Builder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="avatar-icon-192.png">
<title>Duolingo Avatar Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Feather Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; color: #3c3c3c; height: 100vh; overflow: hidden; }

.app-header { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 18px; background: #fff; border-bottom: 2px solid #e5e5e5; flex-shrink: 0; }
.app-title { font-size: 15px; font-weight: 800; color: #3c3c3c; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: #58cc02; }
.dot.wait { background: #ffc107; }

.btn { padding: 8px 16px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.12s; font-family: inherit; }
.btn-primary { background: #58cc02; color: #fff; border-bottom: 3px solid #46a302; }
.btn-primary:hover { background: #4cb000; }
.btn-secondary { background: #e5e5e5; color: #3c3c3c; border-bottom: 3px solid #d1d1d1; }
.btn-secondary:hover { background: #dadada; }
.btn-danger { background: #ffdfdf; color: #b3261e; border-bottom: 3px solid #efc4c4; }
.btn-danger:hover { background: #ffd2d2; }

.main-layout { display: grid; grid-template-columns: 92px minmax(360px, 1fr) minmax(420px, 50%); height: calc(100vh - 42px); overflow: hidden; padding: 16px; gap: 16px; background: #f0f0f0; }

.tool-rail { display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: #fff; border-radius: 16px; padding: 12px 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow-y: auto; }
.tool-rail .btn { width: 100%; padding: 9px 8px; font-size: 12px; line-height: 1.15; }
.tool-spacer { flex: 1; min-height: 6px; }

/* LEFT: Avatar preview */
.preview-panel { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; transition: background-color 0.3s; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.preview-panel canvas { max-width: 100%; max-height: 100%; background: transparent; }
.preview-status { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.88); color: #52656D; font-size: 12px; font-weight: 800; box-shadow: 0 1px 8px rgba(0,0,0,0.08); pointer-events: none; }

/* RIGHT: Options */
.options-panel { min-width: 0; display: flex; flex-direction: column; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

.tab-bar { display: flex; background: #fff; border-bottom: 2px solid #e5e5e5; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; justify-content: center; }
.tab-bar::-webkit-scrollbar { height: 0; }
.tab-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 16px 8px; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; min-width: 64px; }
.tab-btn img { width: 34px; height: 34px; opacity: 0.45; transition: opacity 0.15s; }
.tab-btn .tab-icon-text { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #52656D; opacity: 0.45; transition: opacity 0.15s, color 0.15s; }
.tab-btn .tab-label { font-size: 12px; font-weight: 700; color: #52656D; transition: color 0.15s; }
.tab-btn:hover img { opacity: 0.7; }
.tab-btn:hover .tab-icon-text { opacity: 0.7; color: #8a9ba8; }
.tab-btn:hover .tab-label { color: #8a9ba8; }
.tab-btn.active { border-bottom-color: #1cb0f6; }
.tab-btn.active img { opacity: 1; }
.tab-btn.active .tab-icon-text { opacity: 1; color: #1cb0f6; }
.tab-btn.active .tab-label { color: #1cb0f6; }

.options-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; }
.options-scroll::-webkit-scrollbar { width: 5px; }
.options-scroll::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 3px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.section { margin-bottom: 28px; }
.section-header { font-size: 16px; font-weight: 800; color: #3c3c3c; margin-bottom: 14px; }

.swatch-grid { display: flex; flex-wrap: wrap; gap: 11px; }
.swatch { width: 56px; height: 56px; border-radius: 50%; cursor: pointer; border: 3px solid #e5e5e5; transition: transform 0.12s, border-color 0.12s; position: relative; flex-shrink: 0; }
.swatch:hover { transform: scale(1.15); border-color: #a0a0a0; }
.swatch.selected { border-color: #1cb0f6; box-shadow: 0 0 0 3px rgba(28,176,246,0.25); }
.swatch.selected::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }

.tile-grid { display: flex; flex-wrap: wrap; gap: 11px; }
.tile { width: 120px; height: 120px; border-radius: 14px; cursor: pointer; border: 3px solid #e5e5e5; background: #f7f7f7; transition: all 0.12s; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile:hover { border-color: #a0a0a0; transform: scale(1.04); }
.tile.selected { border-color: #1cb0f6; box-shadow: 0 0 0 3px rgba(28,176,246,0.25); }
.tile .tile-canvas { width: 100%; height: 100%; border-radius: 11px; position: absolute; inset: 0; }
.tile .tile-placeholder { font-size: 36px; opacity: 0.15; z-index: 1; }
.tile.loading .tile-placeholder { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.3; } }

.thumb-status { font-size: 10px; color: #aaa; text-align: center; padding: 2px; flex-shrink: 0; min-height: 18px; }

.action-list { display: flex; flex-direction: column; gap: 12px; max-width: 420px; }
.action-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.action-note { color: #777; font-size: 12px; line-height: 1.45; }
.save-status { color: #52656D; font-size: 13px; font-weight: 700; line-height: 1.45; }
.file-btn { display: inline-flex; align-items: center; justify-content: center; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.mobile-action-bar { display: none; }
.more-sheet { position: fixed; inset: 0; z-index: 120; display: none; }
.more-sheet.open { display: block; }
.more-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.28); }
.more-panel { position: absolute; left: 50%; top: 50%; width: min(420px, calc(100vw - 32px)); transform: translate(-50%, -50%); background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.more-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.more-title { font-size: 16px; font-weight: 800; }
.more-close { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #e5e5e5; color: #3c3c3c; font-size: 18px; font-weight: 800; cursor: pointer; }

.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay.hidden { display: none; }
.spinner { width: 48px; height: 48px; border: 4px solid #e5e5e5; border-top-color: #1cb0f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #777; }

@media (max-width: 760px) {
  body { height: 100vh; height: 100dvh; overflow: hidden; }
  .app-header { height: 38px; padding: 0 12px; }
  .app-title { font-size: 14px; }
  .btn { padding: 8px 12px; font-size: 12px; border-radius: 9px; white-space: nowrap; }

  .main-layout { display: grid; grid-template-columns: 1fr; grid-template-rows: clamp(238px, 38vh, 360px) minmax(0, 1fr); grid-template-rows: clamp(238px, 38dvh, 360px) minmax(0, 1fr); height: calc(100vh - 38px - 64px); height: calc(100dvh - 38px - 64px - env(safe-area-inset-bottom)); padding: 0; gap: 0; overflow: hidden; }
  .tool-rail { display: none; }
  .preview-panel { width: 100%; min-height: 0; border-radius: 0; box-shadow: none; }
  .preview-status { top: 10px; left: 10px; min-height: 26px; padding: 5px 9px; font-size: 11px; }
  .options-panel { width: 100%; min-height: 0; height: 100%; border-radius: 0; box-shadow: none; overflow: hidden; }
  .tab-bar { position: static; justify-content: flex-start; height: 58px; border-top: 0; border-bottom: 2px solid #e5e5e5; box-shadow: none; }
  .tab-btn { min-width: 64px; height: 58px; padding: 7px 8px 6px; border-top: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { border-top-color: transparent; border-bottom-color: #1cb0f6; }
  .tab-btn img, .tab-btn .tab-icon-text { width: 27px; height: 27px; }
  .tab-btn .tab-label { font-size: 11px; }
  .thumb-status { min-height: 16px; }
  .options-scroll { flex: 1; min-height: 0; max-height: none; overflow-y: auto; padding: 14px 12px 20px; }
  .swatch-grid { flex-wrap: nowrap; overflow-x: auto; padding: 3px 3px 8px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .swatch-grid::-webkit-scrollbar { height: 0; }
  .swatch { width: 50px; height: 50px; scroll-snap-align: start; }
  .tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
  .tile { width: 100%; height: auto; min-height: 104px; aspect-ratio: 1; border-radius: 12px; }
  .swatch { width: 50px; height: 50px; }
  .action-list { max-width: none; }
  .mobile-action-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: calc(64px + env(safe-area-inset-bottom)); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 2px solid #e5e5e5; box-shadow: 0 -2px 14px rgba(0,0,0,0.08); }
  .mobile-action-bar .btn { width: 100%; }
  .more-panel { left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-height: min(72dvh, 520px); transform: none; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading Avatar Builder...</div>
</div>

<header class="app-header">
  <div class="app-title">Avatar Builder</div>
</header>

<div class="main-layout">
  <aside class="tool-rail" aria-label="Avatar actions">
    <button class="btn btn-primary" onclick="exportPNG()">Export</button>
    <button class="btn btn-secondary" onclick="confirmResetAll()">Reset</button>
    <button class="btn btn-secondary" onclick="openFilePicker()">Upload</button>
    <button class="btn btn-danger" onclick="clearSavedAvatar()">Clear</button>
    <div class="tool-spacer"></div>
    <button class="btn btn-secondary" onclick="openMoreSheet()">More</button>
  </aside>

  <div class="preview-panel" id="previewPanel">
    <div class="preview-status">
      <div class="dot wait" id="statusDot"></div>
      <span id="statusText">Loading</span>
    </div>
    <canvas id="riveCanvas" width="1000" height="1380"></canvas>
  </div>

  <div class="options-panel">
    <div class="tab-bar" id="tabBar"></div>
    <div class="thumb-status" id="thumbStatus"></div>
    <div class="options-scroll" id="tabContent"></div>
  </div>
</div>

<div class="mobile-action-bar" aria-label="Avatar actions">
  <button class="btn btn-primary" onclick="exportPNG()">Export</button>
  <button class="btn btn-secondary" onclick="confirmResetAll()">Reset</button>
  <button class="btn btn-secondary" onclick="openMoreSheet()">More</button>
</div>

<div class="more-sheet" id="moreSheet" aria-hidden="true">
  <div class="more-backdrop" onclick="closeMoreSheet()"></div>
  <div class="more-panel" role="dialog" aria-modal="true" aria-labelledby="moreTitle">
    <div class="more-head">
      <div class="more-title" id="moreTitle">More</div>
      <button class="more-close" onclick="closeMoreSheet()" aria-label="Close">x</button>
    </div>
    <div class="action-list">
      <div class="action-row">
        <button class="btn btn-secondary" onclick="openFilePicker()">Upload .riv</button>
        <button class="btn btn-danger" onclick="clearSavedAvatar()">Clear Saved Avatar</button>
      </div>
      <div class="save-status" data-save-status></div>
      <div class="action-note">Avatar choices are saved locally on this device. Uploaded .riv files are not saved after refresh.</div>
      <div class="action-note">Unofficial fan-made avatar editor. Runs locally in your browser; no files are uploaded by this page.</div>
    </div>
  </div>
</div>

<input class="visually-hidden" type="file" id="fileInput" accept=".riv">
<canvas id="exportCanvas" style="display:none;"></canvas>

<script src="https://unpkg.com/@rive-app/canvas@2.37.8/rive.js"></script>
<script>
// ===================== STATE =====================
let riveInst = null;
let sharedRiveFile = null;
let smNames = [];
let currentSM = '';
let triggerInput = null;
let fireTimeout = null;
let builderConfig = null;
let currentInputValues = {};
let stateMachineInputs = {};
let riveBuffer = null;
let tileInstances = new Map();
let dirtyTabs = new Set();
let currentTabIdx = 0;
let tileDrawPending = false;
let bgColorMap = {};
let defaultInputValues = {};
let hasAvatarChanges = false;
let statusTimer = null;

const STORAGE_KEY = 'duolingoAvatarCreator.avatarState.v1';
const API_BASE_URL = 'https://duolingo-avator-creator.wei-shi-ws.workers.dev';
let backendConfig = {
  baseUrl: API_BASE_URL,
  available: false,
  config: null,
};
window.avatarBackend = backendConfig;

const TAB_DEFS = [
  { icon: 'avatar_builder_body_unselected_dark.svg', label: 'Body', idx: 0 },
  { icon: 'avatar_builder_face_unselected_dark.svg', label: 'Eyes', idx: 1 },
  { icon: 'avatar_builder_hair_unselected_dark.svg', label: 'Hair', idx: 2 },
  { icon: 'avatar_builder_face_details_unselected_dark.svg', label: 'Face', idx: 3 },
  { icon: 'avatar_builder_facial_hair_unselected_dark.svg', label: 'Beard', idx: 4 },
  { icon: 'avatar_builder_headwear_unselected_dark.svg', label: 'Hat', idx: 5 },
  { icon: 'avatar_builder_tshirt_unselected_dark.svg', label: 'Shirt', idx: 6 },
  { icon: 'avatar_builder_background_unselected_dark.svg', label: 'BG', idx: 7 },
];

const canvas = document.getElementById('riveCanvas');
const previewPanel = document.getElementById('previewPanel');
const exportCanvas = document.getElementById('exportCanvas');
const tabBar = document.getElementById('tabBar');
const tabContent = document.getElementById('tabContent');
const loadingOverlay = document.getElementById('loadingOverlay');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const thumbStatus = document.getElementById('thumbStatus');

// ===================== TRIGGER =====================
function scheduleTrigger() {
  if (!triggerInput) return;
  if (fireTimeout) clearTimeout(fireTimeout);
  fireTimeout = setTimeout(() => { triggerInput.fire(); fireTimeout = null; }, 100);
}

// ===================== SHARED RIVEFILE =====================
async function createSharedRiveFile(buffer) {
  const ab = new Uint8Array(buffer);
  const riveFile = new window.rive.RiveFile({
    buffer: ab,
    enableRiveAssetCDN: false,
  });
  await riveFile.init();
  return riveFile;
}

// ===================== MAIN RIVE =====================
async function loadRiveFile(buffer) {
  riveBuffer = buffer;

  // Clean up old state
  if (riveInst) { try { riveInst.cleanup(); } catch(e) {} riveInst = null; }
  destroyAllTileInstances();
  smNames = []; currentSM = ''; stateMachineInputs = {}; currentInputValues = {};
  defaultInputValues = {}; hasAvatarChanges = false;
  sharedRiveFile = null;

  try {
    sharedRiveFile = await createSharedRiveFile(buffer);
  } catch(e) {
    console.error('RiveFile init error:', e);
    loadingOverlay.classList.add('hidden');
    return;
  }

  const Rive = window.rive?.Rive;
  const Layout = window.rive?.Layout;
  const Fit = window.rive?.Fit;
  const Alignment = window.rive?.Alignment;
  if (!Rive) return;

  riveInst = new Rive({
    layout: Layout && Fit && Alignment ? new Layout({ fit: Fit.Cover, alignment: Alignment.Center }) : undefined,
    canvas, riveFile: sharedRiveFile, autoplay: false,
    onLoad: () => onMainLoaded(),
    onLoadError: (err) => console.error('Rive error:', err),
  });
}

function onMainLoaded() {
  if (!riveInst) return;
  const ab = riveInst.riveFile.file.defaultArtboard();
  smNames = [];
  for (let i = 0; i < ab.stateMachineCount(); i++) smNames.push(ab.stateMachineByIndex(i).name);
  setStatus('Ready', 'ok');

  riveInst.play(smNames);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      selectStateMachine('SMAvatar');
      applyConfigDefaults();
      applySavedAvatarState();
      renderUI();
      loadingOverlay.classList.add('hidden');
    });
  });
}

function selectStateMachine(name) {
  if (!riveInst || !name) return;
  currentSM = name;
  const inputs = riveInst.stateMachineInputs(name);
  if (!inputs) return;

  stateMachineInputs = {}; currentInputValues = {}; triggerInput = null;
  for (const inp of inputs) {
    stateMachineInputs[inp.name] = inp;
    if (inp.type === 58) { if (inp.name === 'bounce_trig') triggerInput = inp; }
    else currentInputValues[inp.name] = inp.value;
  }
  updateBackground();
}

// ===================== TILE RIVE INSTANCES =====================
function createTileInstance(canvas, fb) {
  return new Promise((resolve) => {
    const Layout = window.rive?.Layout;
    const Fit = window.rive?.Fit;
    const Alignment = window.rive?.Alignment;
    const layout = Layout && Fit && Alignment
      ? new Layout({ fit: Fit.Cover, alignment: Alignment.Center })
      : undefined;

    const instance = new window.rive.Rive({
      canvas: canvas,
      riveFile: sharedRiveFile,
      layout: layout,
      autoplay: false,
      stateMachines: 'SMAvatar',
      onLoad: () => {
        const inputs = instance.stateMachineInputs('SMAvatar');
        if (!inputs) { resolve(instance); return; }
        instance._inputs = inputs;

        // Build lookup map in one pass, also find trigger
        const inputMap = Object.create(null);
        let trig = null;
        for (const inp of inputs) {
          inputMap[inp.name] = inp;
          if (inp.type === 58 && inp.name === 'bounce_trig') trig = inp;
        }

        // Set baseline: all currentInputValues
        for (const inp of inputs) {
          if ((inp.type === 56 || inp.type === 59) && currentInputValues[inp.name] !== undefined) {
            if (inp.type === 56) inp.value = currentInputValues[inp.name];
            else inp.value = !!currentInputValues[inp.name];
          }
        }

        // Apply featureButton overrides (O(1) lookup via map)
        for (const [key, val] of Object.entries(fb.statesToOverride)) {
          const inp = inputMap[key];
          if (!inp) continue;
          if (inp.type === 56) inp.value = val;
          else if (inp.type === 59) inp.value = !!val;
        }

        // Fire trigger + draw
        if (trig) trig.fire();
        instance.drawFrame();
        resolve(instance);
      },
      onLoadError: () => resolve(null),
    });
  });
}

function destroyTabInstances(tabIdx) {
  for (const [key, instance] of tileInstances) {
    if (key.startsWith(`${tabIdx}-`)) {
      try { instance.cleanup(); } catch(e) {}
      tileInstances.delete(key);
    }
  }
}

function destroyAllTileInstances() {
  for (const [, instance] of tileInstances) {
    try { instance.cleanup(); } catch(e) {}
  }
  tileInstances.clear();
}

function setStatus(text, state = 'ok', transient = false) {
  if (statusDot) statusDot.className = `dot ${state}`;
  if (statusText) statusText.textContent = text;
  if (statusTimer) {
    clearTimeout(statusTimer);
    statusTimer = null;
  }
  if (transient) {
    statusTimer = setTimeout(() => {
      if (statusDot) statusDot.className = 'dot ok';
      if (statusText) statusText.textContent = 'Ready';
      statusTimer = null;
    }, 1400);
  }
}

function updateTileInstancesForState(stateName, newValue) {
  for (const [key, instance] of tileInstances) {
    // Only update instances on the visible tab; others will be rebuilt lazily
    if (!key.startsWith(`${currentTabIdx}-`)) continue;
    const inputs = instance._inputs;
    if (!inputs) continue;
    let inp = null;
    for (const x of inputs) { if (x.name === stateName) { inp = x; break; } }
    if (!inp) continue;
    if (inp.type === 56) inp.value = newValue;
    else if (inp.type === 59) inp.value = !!newValue;
  }
  // Deduplicate rAF — only schedule one draw pass per frame
  if (tileDrawPending) return;
  tileDrawPending = true;
  requestAnimationFrame(() => {
    tileDrawPending = false;
    for (const [key, instance] of tileInstances) {
      if (!key.startsWith(`${currentTabIdx}-`)) continue;
      try { instance.drawFrame(); } catch(e) {}
    }
  });
}

async function renderTabTiles(tabIdx) {
  if (!sharedRiveFile || !builderConfig) return;

  // If tab already has live instances and isn't dirty, nothing to do
  if (hasActiveTabInstances(tabIdx) && !dirtyTabs.has(tabIdx)) return;

  // Only destroy old instances if this tab is dirty (state changed)
  if (dirtyTabs.has(tabIdx)) {
    destroyTabInstances(tabIdx);
  }

  const panels = [...tabContent.querySelectorAll('.tab-panel')];
  const panel = panels[tabIdx];
  if (!panel) return;

  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  const tab = tabs[tabIdx];
  if (!tab) return;

  const tileGrids = panel.querySelectorAll('.tile-grid');
  let gridIdx = 0;
  const workItems = [];

  for (const section of tab.sections) {
    if (section.buttonType !== 'FEATURE' || gridIdx >= tileGrids.length) continue;
    const grid = tileGrids[gridIdx];
    const tiles = grid.querySelectorAll('.tile');

    for (let i = 0; i < section.featureButtons.length; i++) {
      const tile = tiles[i];
      if (!tile) continue;
      const fb = section.featureButtons[i];

      // Find or create tile canvas
      let tileCanvas = tile.querySelector('canvas');
      if (!tileCanvas) {
        tileCanvas = document.createElement('canvas');
        tileCanvas.width = 252;
        tileCanvas.height = 252;
        tileCanvas.className = 'tile-canvas';
        tile.appendChild(tileCanvas);
        const ph = tile.querySelector('.tile-placeholder');
        if (ph) ph.style.display = 'none';
      }

      workItems.push({ key: `${tabIdx}-${gridIdx}-${i}`, tileCanvas, fb, tile });
    }
    gridIdx++;
  }

  if (workItems.length === 0) {
    dirtyTabs.delete(tabIdx);
    thumbStatus.textContent = '';
    return;
  }

  thumbStatus.textContent = `Loading... 0/${workItems.length}`;
  let done = 0;

  // Batch creation: 8 at a time, yield to browser between batches
  const BATCH_SIZE = 8;
  for (let i = 0; i < workItems.length; i += BATCH_SIZE) {
    const batch = workItems.slice(i, i + BATCH_SIZE);
    const results = await Promise.all(batch.map(async (w) => {
      const instance = await createTileInstance(w.tileCanvas, w.fb);
      return { ...w, instance };
    }));
    for (const r of results) {
      if (r.instance) {
        tileInstances.set(r.key, r.instance);
        r.tile.classList.remove('loading');
      }
      done++;
      thumbStatus.textContent = `Loading... ${done}/${workItems.length}`;
    }
    // Yield to browser between batches
    if (i + BATCH_SIZE < workItems.length) {
      await new Promise(r => setTimeout(r, 0));
    }
  }

  dirtyTabs.delete(tabIdx);
  thumbStatus.textContent = '';
}

// ===================== LOCAL STATE =====================
function getSerializableAvatarState() {
  const state = {};
  for (const [key, value] of Object.entries(currentInputValues)) {
    if (typeof value === 'number' || typeof value === 'boolean') state[key] = value;
  }
  return state;
}

function statesMatch(a, b) {
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const key of keys) {
    if (a?.[key] !== b?.[key]) return false;
  }
  return true;
}

function isDefaultAvatarState() {
  if (Object.keys(defaultInputValues).length === 0) return true;
  return statesMatch(getSerializableAvatarState(), defaultInputValues);
}

function markAllTabsDirty() {
  for (let i = 0; i < TAB_DEFS.length; i++) dirtyTabs.add(i);
}

function updateSaveStatus() {
  hasAvatarChanges = !isDefaultAvatarState();
  document.querySelectorAll('[data-save-status]').forEach((el) => {
    el.textContent = hasAvatarChanges
      ? 'Custom avatar saved on this device.'
      : 'Default avatar. No custom state is saved.';
  });
  if (hasAvatarChanges) setStatus('Saved locally', 'ok', true);
  else setStatus('Ready', 'ok');
}

function saveAvatarState() {
  if (Object.keys(defaultInputValues).length === 0) return;
  try {
    if (isDefaultAvatarState()) {
      localStorage.removeItem(STORAGE_KEY);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        state: getSerializableAvatarState(),
      }));
    }
  } catch(e) {}
  updateSaveStatus();
}

function loadSavedAvatarState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    const state = parsed?.state;
    if (!state || typeof state !== 'object') return null;
    const clean = {};
    for (const [key, value] of Object.entries(state)) {
      if (typeof value === 'number' || typeof value === 'boolean') clean[key] = value;
    }
    return Object.keys(clean).length > 0 ? clean : null;
  } catch(e) {
    return null;
  }
}

function applyInputValue(name, value) {
  const inp = stateMachineInputs[name];
  if (!inp) return false;
  if (inp.type === 56 && typeof value === 'number') {
    inp.value = value;
    currentInputValues[name] = value;
    return true;
  }
  if (inp.type === 59 && typeof value === 'boolean') {
    inp.value = value;
    currentInputValues[name] = value;
    return true;
  }
  return false;
}

function applySavedAvatarState() {
  const saved = loadSavedAvatarState();
  if (!saved) {
    updateSaveStatus();
    return false;
  }
  let applied = false;
  for (const [name, value] of Object.entries(saved)) {
    if (applyInputValue(name, value)) applied = true;
  }
  if (!applied) {
    updateSaveStatus();
    return false;
  }
  scheduleTrigger();
  updateBackground();
  markAllTabsDirty();
  updateSaveStatus();
  return true;
}

function clearSavedAvatar() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  resetAll();
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  updateSaveStatus();
}

function confirmResetAll() {
  if (!window.confirm('Reset avatar to default?')) return;
  resetAll();
}

function openFilePicker() {
  document.getElementById('fileInput')?.click();
}

function openMoreSheet() {
  const sheet = document.getElementById('moreSheet');
  if (!sheet) return;
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
}

function closeMoreSheet() {
  const sheet = document.getElementById('moreSheet');
  if (!sheet) return;
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
}

async function loadBackendConfig() {
  try {
    const resp = await fetch(`${API_BASE_URL}/api/config`, {
      headers: { 'Accept': 'application/json' },
    });
    if (!resp.ok) return;
    backendConfig = {
      baseUrl: API_BASE_URL,
      available: true,
      config: await resp.json(),
    };
    window.avatarBackend = backendConfig;
  } catch(e) {
    window.avatarBackend = backendConfig;
  }
}

window.addEventListener('beforeunload', (e) => {
  if (!hasAvatarChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

// ===================== VALUE SETTING =====================
function findTabForState(stateName) {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs) return -1;
  for (let i = 0; i < TAB_DEFS.length; i++) {
    const tab = tabs[i];
    if (!tab) continue;
    for (const section of tab.sections) {
      if (section.buttonType === 'FEATURE') {
        for (const fb of section.featureButtons) { if (fb.state === stateName) return i; }
      }
      if (section.buttonType === 'IMAGE') {
        for (const ib of section.imageButtons) { if (ib.state === stateName) return i; }
      }
    }
  }
  return -1;
}

function invalidateThumbnails(stateName) {
  if (!stateName) {
    for (let i = 0; i < TAB_DEFS.length; i++) dirtyTabs.add(i);
  } else {
    const changedTab = findTabForState(stateName);
    for (let i = 0; i < TAB_DEFS.length; i++) {
      if (i !== changedTab) dirtyTabs.add(i);
    }
    // Update current tab's live tile instances
    const val = currentInputValues[stateName];
    if (val !== undefined) updateTileInstancesForState(stateName, val);
  }
}

function setSMValue(name, value) {
  const inp = stateMachineInputs[name];
  if (!inp) return;
  if (inp.type === 56) {
    inp.value = value;
    currentInputValues[name] = value;
  } else if (inp.type === 59) {
    const boolValue = !!value;
    inp.value = boolValue;
    currentInputValues[name] = boolValue;
  }
  invalidateThumbnails(name);
  saveAvatarState();
}

function applyFeatureButton(fb) {
  const primaryState = fb.state;
  for (const [key, val] of Object.entries(fb.statesToOverride)) {
    if (val === 0 && key !== primaryState) continue;
    setSMValue(key, val);
  }
}

// ===================== BACKGROUND =====================
function updateBackground() {
  const bgVal = currentInputValues['BackgroundColor'];
  const hex = bgColorMap[bgVal] || bgColorMap[1] || '#E5E5E5';
  previewPanel.style.backgroundColor = hex;
  canvas.style.backgroundColor = hex;
}

function buildBgColorMap() {
  if (!builderConfig) return;
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  for (const tab of tabs) {
    for (const section of tab.sections) {
      if (section.buttonType === 'IMAGE') {
        for (const ib of section.imageButtons) {
          if (ib.state === 'BackgroundColor') bgColorMap[ib.value] = ib.color;
        }
      }
    }
  }
}

// ===================== EXPORT =====================
function getCurrentBgHex() {
  const bgVal = currentInputValues['BackgroundColor'];
  return bgColorMap[bgVal] || '#E5E5E5';
}

function exportPNG() {
  const bgHex = getCurrentBgHex();
  const srcW = canvas.width;
  const srcH = canvas.height;
  exportCanvas.width = srcW;
  exportCanvas.height = srcH;
  const ctx = exportCanvas.getContext('2d');
  ctx.fillStyle = bgHex;
  ctx.fillRect(0, 0, srcW, srcH);
  ctx.drawImage(canvas, 0, 0);
  const link = document.createElement('a');
  link.download = `avatar_${Date.now()}.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
}

function createTabButton(def) {
  const btn = document.createElement('button');
  btn.className = 'tab-btn';
  btn.innerHTML = `<img src="${def.icon}" alt="${def.label}"><span class="tab-label">${def.label}</span>`;
  btn.onclick = () => switchTab(def.idx);
  return btn;
}

// ===================== UI RENDER =====================
function renderUI() {
  if (!builderConfig) return;
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;

  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  TAB_DEFS.forEach((def) => {
    tabBar.appendChild(createTabButton(def));

    const tab = tabs[def.idx];
    if (!tab) return;
    const panel = document.createElement('div');
    panel.className = 'tab-panel';

    for (const section of tab.sections) {
      const secDiv = document.createElement('div');
      secDiv.className = 'section';
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = section.header;
      secDiv.appendChild(header);

      if (section.buttonType === 'IMAGE') {
        const grid = document.createElement('div');
        grid.className = 'swatch-grid';
        const stateName = section.imageButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const ib of section.imageButtons) {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.dataset.state = ib.state;
          swatch.dataset.value = ib.value;
          if (ib.value === currentVal) swatch.classList.add('selected');
          swatch.style.backgroundColor = ib.color;
          swatch.title = ib.color;
          swatch.onclick = () => {
            setSMValue(ib.state, ib.value);
            if (ib.state === 'BackgroundColor') updateBackground();
            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          };
          grid.appendChild(swatch);
        }
        secDiv.appendChild(grid);
      } else if (section.buttonType === 'FEATURE') {
        const grid = document.createElement('div');
        grid.className = 'tile-grid';
        const stateName = section.featureButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const fb of section.featureButtons) {
          const tile = document.createElement('div');
          tile.className = 'tile loading';
          tile.dataset.state = fb.state;
          tile.dataset.value = fb.value;
          if (fb.value === currentVal) tile.classList.add('selected');

          const ph = document.createElement('span');
          ph.className = 'tile-placeholder';
          ph.textContent = fb.value === 0 ? '✕' : '';
          tile.appendChild(ph);

          tile.onclick = () => {
            applyFeatureButton(fb);
            updateBackground();
            grid.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
            tile.classList.add('selected');
            refreshAllHighlights();
          };
          grid.appendChild(tile);
        }
        secDiv.appendChild(grid);
      }
      panel.appendChild(secDiv);
    }
    tabContent.appendChild(panel);
  });

  switchTab(0);
  updateSaveStatus();
  setTimeout(() => renderTabTiles(0), 200);
}

function switchTab(idx) {
  currentTabIdx = idx;
  tabBar.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  tabContent.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));

  if (dirtyTabs.has(idx) || !hasActiveTabInstances(idx)) {
    renderTabTiles(idx);
  } else {
    refreshAllHighlights();
  }
}

function hasActiveTabInstances(tabIdx) {
  for (const key of tileInstances.keys()) {
    if (key.startsWith(`${tabIdx}-`)) return true;
  }
  return false;
}

function refreshAllHighlights() {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs) return;
  const panels = tabContent.querySelectorAll('.tab-panel');
  panels.forEach((panel, ti) => {
    const def = TAB_DEFS.find(d => d.idx === ti);
    if (!def || def.idx >= tabs.length) return;
    const tab = tabs[def.idx];
    let si = 0, fi = 0;
    const swatchGrids = panel.querySelectorAll('.swatch-grid');
    const tileGrids = panel.querySelectorAll('.tile-grid');
    for (const section of tab.sections) {
      if (section.buttonType === 'IMAGE' && si < swatchGrids.length) {
        const cur = currentInputValues[section.imageButtons[0]?.state];
        swatchGrids[si].querySelectorAll('.swatch').forEach(s => {
          s.classList.toggle('selected', parseInt(s.dataset.value) === cur);
        });
        si++;
      } else if (section.buttonType === 'FEATURE' && fi < tileGrids.length) {
        const cur = currentInputValues[section.featureButtons[0]?.state];
        tileGrids[fi].querySelectorAll('.tile').forEach(t => {
          t.classList.toggle('selected', parseInt(t.dataset.value) === cur);
        });
        fi++;
      }
    }
  });
}

function applyConfigDefaults() {
  if (!builderConfig || !currentSM) return;
  const defaults = builderConfig.avatarBuilderConfig.defaultBuiltAvatarState;
  if (!defaults) return;
  for (const [name, value] of Object.entries(defaults)) {
    const inp = stateMachineInputs[name];
    if (!inp) continue;
    if (inp.type === 56) {
      inp.value = value;
      currentInputValues[name] = value;
    } else if (inp.type === 59) {
      const boolValue = !!value;
      inp.value = boolValue;
      currentInputValues[name] = boolValue;
    }
  }
  defaultInputValues = { ...getSerializableAvatarState() };
  scheduleTrigger();
  updateBackground();
  dirtyTabs.clear();
  markAllTabsDirty();
  updateSaveStatus();
}

// ===================== RESET =====================
function resetAll() {
  if (!builderConfig || !currentSM) return;
  const defaults = Object.keys(defaultInputValues).length
    ? defaultInputValues
    : builderConfig.avatarBuilderConfig.defaultBuiltAvatarState;
  if (!defaults) return;
  for (const [name, value] of Object.entries(defaults)) {
    applyInputValue(name, value);
  }
  scheduleTrigger();
  updateBackground();
  destroyAllTileInstances();
  dirtyTabs.clear();
  markAllTabsDirty();
  saveAvatarState();
  if (builderConfig) renderUI();
}

// ===================== EVENTS =====================
document.addEventListener('change', async (e) => {
  if (e.target?.id !== 'fileInput') return;
  const file = e.target.files?.[0];
  if (!file) return;
  loadRiveFile(await file.arrayBuffer());
});

// ===================== INIT =====================
async function init() {
  loadBackendConfig();
  try {
    const resp = await fetch('avatar_builder_config.json');
    if (resp.ok) { builderConfig = await resp.json(); buildBgColorMap(); }
  } catch(e) { console.warn('Config:', e.message); }
  try {
    const resp = await fetch('avatar_builder_25_sept2025.riv');
    if (resp.ok) { loadRiveFile(await resp.arrayBuffer()); }
    else { loadingOverlay.classList.add('hidden'); }
  } catch(e) { loadingOverlay.classList.add('hidden'); }
}
window.addEventListener('load', init);
</script>
