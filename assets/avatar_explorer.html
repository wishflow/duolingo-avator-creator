<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duolingo Avatar Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Feather Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; color: #3c3c3c; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 0 44px; height: 48px; background: #fff; border-bottom: 2px solid #e5e5e5; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-left h1 { font-size: 16px; font-weight: 800; color: #3c3c3c; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: #58cc02; }
.dot.wait { background: #ffc107; }
.header-right { display: flex; gap: 8px; align-items: center; }
.header-right input[type="file"] { font-size: 11px; color: #777; width: 180px; }

.btn { padding: 8px 20px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.12s; font-family: inherit; }
.btn-primary { background: #58cc02; color: #fff; border-bottom: 3px solid #46a302; }
.btn-primary:hover { background: #4cb000; }
.btn-secondary { background: #e5e5e5; color: #3c3c3c; border-bottom: 3px solid #d1d1d1; }
.btn-secondary:hover { background: #dadada; }

.main-layout { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; background: #f0f0f0; }

/* LEFT: Avatar preview — matches Duolingo: portrait canvas centered in white panel */
.preview-panel { width: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.3s; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.preview-panel canvas { max-width: 100%; max-height: 100%; background: transparent; }

/* RIGHT: Options */
.options-panel { width: 50%; display: flex; flex-direction: column; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

.tab-bar { display: flex; background: #fff; border-bottom: 2px solid #e5e5e5; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; justify-content: center; }
.tab-bar::-webkit-scrollbar { height: 0; }
.tab-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 16px 8px; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; min-width: 64px; }
.tab-btn img { width: 34px; height: 34px; opacity: 0.45; transition: opacity 0.15s; }
.tab-btn .tab-label { font-size: 12px; font-weight: 700; color: #52656D; transition: color 0.15s; }
.tab-btn:hover img { opacity: 0.7; }
.tab-btn:hover .tab-label { color: #8a9ba8; }
.tab-btn.active { border-bottom-color: #1cb0f6; }
.tab-btn.active img { opacity: 1; }
.tab-btn.active .tab-label { color: #1cb0f6; }

.options-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; }
.options-scroll::-webkit-scrollbar { width: 5px; }
.options-scroll::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 3px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.section { margin-bottom: 28px; }
.section-header { font-size: 16px; font-weight: 800; color: #3c3c3c; margin-bottom: 14px; }

.swatch-grid { display: flex; flex-wrap: wrap; gap: 11px; }
.swatch { width: 56px; height: 56px; border-radius: 50%; cursor: pointer; border: 3px solid #e5e5e5; transition: transform 0.12s, border-color 0.12s; position: relative; flex-shrink: 0; }
.swatch:hover { transform: scale(1.15); border-color: #a0a0a0; }
.swatch.selected { border-color: #1cb0f6; box-shadow: 0 0 0 3px rgba(28,176,246,0.25); }
.swatch.selected::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }

.tile-grid { display: flex; flex-wrap: wrap; gap: 11px; }
.tile { width: 120px; height: 120px; border-radius: 14px; cursor: pointer; border: 3px solid #e5e5e5; background: #f7f7f7; transition: all 0.12s; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile:hover { border-color: #a0a0a0; transform: scale(1.04); }
.tile.selected { border-color: #1cb0f6; box-shadow: 0 0 0 3px rgba(28,176,246,0.25); }
.tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; position: absolute; inset: 0; }
.tile .tile-placeholder { font-size: 36px; opacity: 0.15; z-index: 1; }
.tile.loading .tile-placeholder { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.3; } }

.thumb-status { font-size: 10px; color: #aaa; text-align: center; padding: 2px; flex-shrink: 0; min-height: 18px; }

.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay.hidden { display: none; }
.spinner { width: 48px; height: 48px; border: 4px solid #e5e5e5; border-top-color: #1cb0f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #777; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading Avatar Builder...</div>
</div>

<div class="header">
  <div class="header-left">
    <h1>Avatar Builder</h1>
    <div class="dot wait" id="statusDot"></div>
  </div>
  <div class="header-right">
    <input type="file" id="fileInput" accept=".riv">
    <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
    <button class="btn btn-primary" onclick="exportPNG()">Export PNG</button>
  </div>
</div>

<div class="main-layout">
  <div class="preview-panel" id="previewPanel">
    <canvas id="riveCanvas" width="1000" height="1380"></canvas>
  </div>

  <div class="options-panel">
    <div class="tab-bar" id="tabBar"></div>
    <div class="thumb-status" id="thumbStatus"></div>
    <div class="options-scroll" id="tabContent"></div>
  </div>
</div>

<canvas id="thumbCanvas" width="252" height="252" style="visibility:hidden;position:absolute;pointer-events:none;"></canvas>
<canvas id="exportCanvas" style="display:none;"></canvas>

<script src="https://unpkg.com/@rive-app/canvas@2.37.8/rive.js"></script>
<script>
// ===================== STATE =====================
let riveInst = null;
let thumbRive = null;
let thumbReady = false;
let smNames = [];
let currentSM = '';
let triggerInput = null;
let fireTimeout = null;
let builderConfig = null;
let currentInputValues = {};
let stateMachineInputs = {};
let riveBuffer = null;
let thumbRegenTimeout = null;
let thumbCache = {};
let thumbNameMap = null;
let dirtyTabs = new Set();
let bgColorMap = {};

const TAB_DEFS = [
  { icon: 'avatar_builder_body_unselected_dark.svg', label: 'Body', idx: 0 },
  { icon: 'avatar_builder_face_unselected_dark.svg', label: 'Eyes', idx: 1 },
  { icon: 'avatar_builder_hair_unselected_dark.svg', label: 'Hair', idx: 2 },
  { icon: 'avatar_builder_face_details_unselected_dark.svg', label: 'Face', idx: 3 },
  { icon: 'avatar_builder_facial_hair_unselected_dark.svg', label: 'Beard', idx: 4 },
  { icon: 'avatar_builder_headwear_unselected_dark.svg', label: 'Hat', idx: 5 },
  { icon: 'avatar_builder_tshirt_unselected_dark.svg', label: 'Shirt', idx: 6 },
  { icon: 'avatar_builder_background_unselected_dark.svg', label: 'BG', idx: 7 },
];

const canvas = document.getElementById('riveCanvas');
const previewPanel = document.getElementById('previewPanel');
const thumbCanvas = document.getElementById('thumbCanvas');
const exportCanvas = document.getElementById('exportCanvas');
const tabBar = document.getElementById('tabBar');
const tabContent = document.getElementById('tabContent');
const loadingOverlay = document.getElementById('loadingOverlay');
const statusDot = document.getElementById('statusDot');
const thumbStatus = document.getElementById('thumbStatus');

// ===================== TRIGGER =====================
function scheduleTrigger() {
  if (!triggerInput) return;
  if (fireTimeout) clearTimeout(fireTimeout);
  fireTimeout = setTimeout(() => { triggerInput.fire(); fireTimeout = null; }, 100);
}

// ===================== MAIN RIVE =====================
function loadRiveFile(buffer) {
  riveBuffer = buffer;
  if (riveInst) { try { riveInst.cleanup(); } catch(e) {} riveInst = null; }
  if (thumbRive) { try { thumbRive.cleanup(); } catch(e) {} thumbRive = null; }
  smNames = []; currentSM = ''; stateMachineInputs = {}; currentInputValues = {};
  thumbCache = {}; thumbReady = false;

  const Rive = window.rive?.Rive;
  const Layout = window.rive?.Layout;
  const Fit = window.rive?.Fit;
  const Alignment = window.rive?.Alignment;
  if (!Rive) return;

  riveInst = new Rive({
    layout: Layout && Fit && Alignment ? new Layout({ fit: Fit.Cover, alignment: Alignment.Center }) : undefined,
    canvas, buffer: new Uint8Array(buffer), autoplay: false,
    onLoad: () => onMainLoaded(),
    onLoadError: (err) => console.error('Rive error:', err),
  });
}

function onMainLoaded() {
  if (!riveInst) return;
  const ab = riveInst.riveFile.file.defaultArtboard();
  smNames = [];
  for (let i = 0; i < ab.stateMachineCount(); i++) smNames.push(ab.stateMachineByIndex(i).name);
  statusDot.className = 'dot ok';

  riveInst.play(smNames);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      selectStateMachine('SMAvatar');
      applyConfigDefaults();
      initThumbnailRive();
      loadingOverlay.classList.add('hidden');
    });
  });
}

function selectStateMachine(name) {
  if (!riveInst || !name) return;
  currentSM = name;
  const inputs = riveInst.stateMachineInputs(name);
  if (!inputs) return;

  stateMachineInputs = {}; currentInputValues = {}; triggerInput = null;
  for (const inp of inputs) {
    stateMachineInputs[inp.name] = inp;
    if (inp.type === 58) { if (inp.name === 'bounce_trig') triggerInput = inp; }
    else currentInputValues[inp.name] = inp.value;
  }
  updateBackground();
  if (builderConfig) renderUI();
}

// ===================== VALUE SETTING =====================
// setSMValue defined below (after helper functions)

function applyFeatureButton(fb) {
  const primaryState = fb.state;
  for (const [key, val] of Object.entries(fb.statesToOverride)) {
    if (val === 0 && key !== primaryState) continue;
    setSMValue(key, val);
  }
  scheduleTrigger();
}

// ===================== BACKGROUND =====================
function updateBackground() {
  const bgVal = currentInputValues['BackgroundColor'];
  const hex = bgColorMap[bgVal] || bgColorMap[1] || '#E5E5E5';
  previewPanel.style.backgroundColor = hex;
  canvas.style.backgroundColor = hex;
}

function buildBgColorMap() {
  if (!builderConfig) return;
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  for (const tab of tabs) {
    for (const section of tab.sections) {
      if (section.buttonType === 'IMAGE') {
        for (const ib of section.imageButtons) {
          if (ib.state === 'BackgroundColor') bgColorMap[ib.value] = ib.color;
        }
      }
    }
  }
}

// ===================== EXPORT =====================
function getCurrentBgHex() {
  const bgVal = currentInputValues['BackgroundColor'];
  return bgColorMap[bgVal] || '#E5E5E5';
}

function exportPNG() {
  const bgHex = getCurrentBgHex();
  const srcW = canvas.width;
  const srcH = canvas.height;
  // Create export canvas matching the display aspect of the Rive canvas
  exportCanvas.width = srcW;
  exportCanvas.height = srcH;
  const ctx = exportCanvas.getContext('2d');
  // Fill entire canvas with background color (covers the area outside the Rive artboard)
  ctx.fillStyle = bgHex;
  ctx.fillRect(0, 0, srcW, srcH);
  // Draw Rive canvas content on top (avatar + artboard background strip)
  ctx.drawImage(canvas, 0, 0);
  // Export
  const link = document.createElement('a');
  link.download = `avatar_${Date.now()}.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
}

// ===================== THUMBNAIL RIVE =====================
function initThumbnailRive() {
  if (!riveBuffer) return;
  const Rive = window.rive?.Rive;
  const Layout = window.rive?.Layout;
  const Fit = window.rive?.Fit;
  const Alignment = window.rive?.Alignment;
  if (!Rive) return;

  thumbRive = new Rive({
    canvas: thumbCanvas,
    buffer: new Uint8Array(riveBuffer),
    autoplay: false,
    layout: Layout && Fit && Alignment ? new Layout({ fit: Fit.Cover, alignment: Alignment.Center }) : undefined,
    onLoad: () => {
      thumbRive.play(smNames);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const inputs = thumbRive.stateMachineInputs('SMAvatar');
          if (inputs) {
            let trig = null;
            for (const inp of inputs) {
              if (inp.type === 58 && inp.name === 'bounce_trig') trig = inp;
              else if (inp.type === 56 && currentInputValues[inp.name] !== undefined) {
                inp.value = currentInputValues[inp.name];
              }
            }
            if (trig) trig.fire();
          }
          thumbReady = true;
          requestAnimationFrame(() => generateVisibleThumbnails());
        });
      });
    },
    onLoadError: () => console.warn('Thumb load error'),
  });
}

function findTabForState(stateName) {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs) return -1;
  for (let i = 0; i < TAB_DEFS.length; i++) {
    const tab = tabs[i];
    if (!tab) continue;
    for (const section of tab.sections) {
      if (section.buttonType === 'FEATURE') {
        for (const fb of section.featureButtons) { if (fb.state === stateName) return i; }
      }
      if (section.buttonType === 'IMAGE') {
        for (const ib of section.imageButtons) { if (ib.state === stateName) return i; }
      }
    }
  }
  return -1;
}

function getThumbNameMap() {
  if (thumbNameMap) return thumbNameMap;
  if (!thumbRive) return null;
  const inputs = thumbRive.stateMachineInputs('SMAvatar');
  if (!inputs) return null;
  thumbNameMap = {};
  for (const inp of inputs) { thumbNameMap[inp.name] = inp; }
  return thumbNameMap;
}

function prepareThumbBase() {
  const nm = getThumbNameMap();
  if (!nm) return;
  for (const [name, inp] of Object.entries(nm)) {
    if ((inp.type === 56 || inp.type === 59) && currentInputValues[name] !== undefined) {
      if (inp.type === 56) inp.value = currentInputValues[name];
      else inp.value = !!currentInputValues[name];
    }
  }
  if (nm['bounce_trig']) nm['bounce_trig'].fire();
  if (thumbRive.draw) thumbRive.draw();
}

function clearTabCache(tabIdx) {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs || tabIdx < 0 || tabIdx >= tabs.length) return;
  const tab = tabs[tabIdx];
  if (!tab) return;
  for (const section of tab.sections) {
    if (section.buttonType === 'FEATURE') {
      for (const fb of section.featureButtons) { delete thumbCache[`${fb.state}_${fb.value}`]; }
    }
  }
}

function updateCurrentTabTiles() {
  const activePanel = tabContent.querySelector('.tab-panel.active');
  if (!activePanel) return;
  const tiles = activePanel.querySelectorAll('.tile');
  for (const tile of tiles) {
    const state = tile.dataset.state;
    const value = parseInt(tile.dataset.value);
    if (state && !isNaN(value)) {
      tile.classList.toggle('selected', currentInputValues[state] === value);
    }
  }
}

function captureThumbFor(fb) {
  return new Promise((resolve) => {
    const key = `${fb.state}_${fb.value}`;
    if (thumbCache[key]) { resolve(thumbCache[key]); return; }
    if (!thumbReady || !thumbRive) { resolve(null); return; }

    const nm = getThumbNameMap();
    if (!nm) { resolve(null); return; }

    const primaryState = fb.state;
    for (const [key, val] of Object.entries(fb.statesToOverride)) {
      if (val === 0 && key !== primaryState) continue;
      if (!nm[key]) continue;
      if (nm[key].type === 56) nm[key].value = val;
      else if (nm[key].type === 59) nm[key].value = !!val;
    }
    if (thumbRive.draw) thumbRive.draw();

    requestAnimationFrame(() => {
      try {
        const uri = thumbCanvas.toDataURL('image/png');
        thumbCache[key] = uri;
        resolve(uri);
      } catch(e) { resolve(null); }
    });
  });
}

async function generateVisibleThumbnails() {
  if (!thumbReady || !builderConfig) return;
  const activePanel = tabContent.querySelector('.tab-panel.active');
  if (!activePanel) return;

  const panels = [...tabContent.querySelectorAll('.tab-panel')];
  const activeIdx = panels.indexOf(activePanel);
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  if (activeIdx < 0 || activeIdx >= tabs.length) return;

  // If this tab is not dirty, just update highlights
  if (!dirtyTabs.has(activeIdx)) {
    updateCurrentTabTiles();
    thumbStatus.textContent = '';
    return;
  }
  dirtyTabs.delete(activeIdx);
  clearTabCache(activeIdx);

  const tab = tabs[activeIdx];
  const tileGrids = activePanel.querySelectorAll('.tile-grid');

  // Set baseline state once for all thumbnails in this tab
  prepareThumbBase();

  let gridIdx = 0;
  const workItems = [];
  for (const section of tab.sections) {
    if (section.buttonType === 'FEATURE' && gridIdx < tileGrids.length) {
      const grid = tileGrids[gridIdx];
      const tiles = grid.querySelectorAll('.tile');
      for (let i = 0; i < section.featureButtons.length; i++) {
        workItems.push({ fb: section.featureButtons[i], tile: tiles[i] || null });
      }
      gridIdx++;
    }
  }

  let done = 0;
  thumbStatus.textContent = `Rendering... 0/${workItems.length}`;
  for (const w of workItems) {
    const uri = await captureThumbFor(w.fb);
    if (uri) updateTile(w.tile, w.fb);
    done++;
    thumbStatus.textContent = `Rendering... ${done}/${workItems.length}`;
  }
  thumbStatus.textContent = '';
}

function updateTile(tile, fb) {
  if (!tile) return;
  const key = `${fb.state}_${fb.value}`;
  const uri = thumbCache[key];
  if (!uri) return;
  tile.classList.remove('loading');
  const ph = tile.querySelector('.tile-placeholder');
  if (ph) ph.style.display = 'none';
  const old = tile.querySelector('img');
  if (old) old.remove();
  const img = document.createElement('img');
  img.src = uri;
  tile.appendChild(img);
}

// ===================== UI RENDER =====================
function renderUI() {
  if (!builderConfig) return;
  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;

  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  TAB_DEFS.forEach((def) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.innerHTML = `<img src="${def.icon}" alt="${def.label}"><span class="tab-label">${def.label}</span>`;
    btn.onclick = () => switchTab(def.idx);
    tabBar.appendChild(btn);

    const tab = tabs[def.idx];
    if (!tab) return;
    const panel = document.createElement('div');
    panel.className = 'tab-panel';

    for (const section of tab.sections) {
      const secDiv = document.createElement('div');
      secDiv.className = 'section';
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = section.header;
      secDiv.appendChild(header);

      if (section.buttonType === 'IMAGE') {
        const grid = document.createElement('div');
        grid.className = 'swatch-grid';
        const stateName = section.imageButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const ib of section.imageButtons) {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.dataset.state = ib.state;
          swatch.dataset.value = ib.value;
          if (ib.value === currentVal) swatch.classList.add('selected');
          swatch.style.backgroundColor = ib.color;
          swatch.title = ib.color;
          swatch.onclick = () => {
            setSMValue(ib.state, ib.value);
            scheduleTrigger();
            if (ib.state === 'BackgroundColor') updateBackground();
            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          };
          grid.appendChild(swatch);
        }
        secDiv.appendChild(grid);
      } else if (section.buttonType === 'FEATURE') {
        const grid = document.createElement('div');
        grid.className = 'tile-grid';
        const stateName = section.featureButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const fb of section.featureButtons) {
          const tile = document.createElement('div');
          tile.className = 'tile loading';
          tile.dataset.state = fb.state;
          tile.dataset.value = fb.value;
          if (fb.value === currentVal) tile.classList.add('selected');

          const ph = document.createElement('span');
          ph.className = 'tile-placeholder';
          ph.textContent = fb.value === 0 ? '✕' : '';
          tile.appendChild(ph);

          const cachedUri = thumbCache[`${fb.state}_${fb.value}`];
          if (cachedUri) {
            tile.classList.remove('loading');
            ph.style.display = 'none';
            const img = document.createElement('img');
            img.src = cachedUri;
            tile.appendChild(img);
          }

          tile.onclick = () => {
            applyFeatureButton(fb);
            updateBackground();
            grid.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
            tile.classList.add('selected');
            refreshAllHighlights();
          };
          grid.appendChild(tile);
        }
        secDiv.appendChild(grid);
      }
      panel.appendChild(secDiv);
    }
    tabContent.appendChild(panel);
  });

  switchTab(0);
  setTimeout(() => generateVisibleThumbnails(), 400);
}

function switchTab(idx) {
  tabBar.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  tabContent.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  // Always regenerate on tab switch (state may have changed since last visit)
  dirtyTabs.add(idx);
  setTimeout(() => generateVisibleThumbnails(), 100);
}

function refreshAllHighlights() {
  const tabs = builderConfig?.avatarBuilderConfig?.stateChooserTabs;
  if (!tabs) return;
  const panels = tabContent.querySelectorAll('.tab-panel');
  panels.forEach((panel, ti) => {
    const def = TAB_DEFS.find(d => d.idx === ti);
    if (!def || def.idx >= tabs.length) return;
    const tab = tabs[def.idx];
    let si = 0, fi = 0;
    const swatchGrids = panel.querySelectorAll('.swatch-grid');
    const tileGrids = panel.querySelectorAll('.tile-grid');
    for (const section of tab.sections) {
      if (section.buttonType === 'IMAGE' && si < swatchGrids.length) {
        const cur = currentInputValues[section.imageButtons[0]?.state];
        swatchGrids[si].querySelectorAll('.swatch').forEach(s => {
          s.classList.toggle('selected', parseInt(s.dataset.value) === cur);
        });
        si++;
      } else if (section.buttonType === 'FEATURE' && fi < tileGrids.length) {
        const cur = currentInputValues[section.featureButtons[0]?.state];
        tileGrids[fi].querySelectorAll('.tile').forEach(t => {
          t.classList.toggle('selected', parseInt(t.dataset.value) === cur);
        });
        fi++;
      }
    }
  });
}

function invalidateThumbnails(stateName) {
  thumbNameMap = null;  // force rebuild after state changes
  if (!stateName) {
    // Full reset: mark all tabs dirty and clear cache
    thumbCache = {};
    for (let i = 0; i < TAB_DEFS.length; i++) dirtyTabs.add(i);
  } else {
    // Mark all OTHER tabs as dirty (current tab's thumbnails stay valid)
    const changedTab = findTabForState(stateName);
    for (let i = 0; i < TAB_DEFS.length; i++) {
      if (i !== changedTab) dirtyTabs.add(i);
    }
  }
  clearTimeout(thumbRegenTimeout);
  thumbRegenTimeout = setTimeout(() => generateVisibleThumbnails(), 150);
}

function setSMValue(name, value) {
  const inp = stateMachineInputs[name];
  if (!inp) return;
  if (inp.type === 56) inp.value = value;
  else if (inp.type === 59) inp.value = !!value;
  currentInputValues[name] = value;
  invalidateThumbnails(name);
}

function applyConfigDefaults() {
  if (!builderConfig || !currentSM) return;
  const defaults = builderConfig.avatarBuilderConfig.defaultBuiltAvatarState;
  if (!defaults) return;
  for (const [name, value] of Object.entries(defaults)) {
    const inp = stateMachineInputs[name];
    if (!inp) continue;
    if (inp.type === 56) inp.value = value;
    else if (inp.type === 59) inp.value = !!value;
    currentInputValues[name] = value;
  }
  scheduleTrigger();
  updateBackground();
  // Mark all tabs dirty on init
  thumbCache = {};
  for (let i = 0; i < TAB_DEFS.length; i++) dirtyTabs.add(i);
  clearTimeout(thumbRegenTimeout);
  thumbRegenTimeout = setTimeout(() => generateVisibleThumbnails(), 150);
}

// ===================== RESET =====================
function resetAll() {
  if (!builderConfig || !currentSM) return;
  const defaults = builderConfig.avatarBuilderConfig.defaultBuiltAvatarState;
  if (!defaults) return;
  for (const [name, value] of Object.entries(defaults)) {
    const inp = stateMachineInputs[name];
    if (!inp) continue;
    if (inp.type === 56) inp.value = value;
    else if (inp.type === 59) inp.value = !!value;
    currentInputValues[name] = value;
  }
  scheduleTrigger();
  updateBackground();
  thumbCache = {};
  thumbNameMap = null;
  for (let i = 0; i < TAB_DEFS.length; i++) dirtyTabs.add(i);
  clearTimeout(thumbRegenTimeout);
  thumbRegenTimeout = setTimeout(() => generateVisibleThumbnails(), 150);
  if (builderConfig) renderUI();
}

// ===================== EVENTS =====================
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadRiveFile(await file.arrayBuffer());
});

// ===================== INIT =====================
async function init() {
  try {
    const resp = await fetch('avatar_builder_config.json');
    if (resp.ok) { builderConfig = await resp.json(); buildBgColorMap(); }
  } catch(e) { console.warn('Config:', e.message); }
  try {
    const resp = await fetch('avatar_builder_25_sept2025.riv');
    if (resp.ok) { loadRiveFile(await resp.arrayBuffer()); }
    else { loadingOverlay.classList.add('hidden'); }
  } catch(e) { loadingOverlay.classList.add('hidden'); }
}
window.addEventListener('load', init);
</script>
