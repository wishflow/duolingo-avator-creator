<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duolingo Avatar Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #131f2c; color: #e8e8e8; display: flex; height: 100vh; overflow: hidden; }

/* ---- Sidebar ---- */
.sidebar { width: 420px; background: #1a2d3d; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #243647; }
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid #243647; flex-shrink: 0; }
.sidebar-header h1 { font-size: 18px; font-weight: 700; color: #fff; }
.sidebar-header .subtitle { font-size: 11px; color: #6b8299; margin-top: 2px; }

/* Tab bar */
.tab-bar { display: flex; background: #152536; border-bottom: 2px solid #243647; flex-shrink: 0; overflow-x: auto; }
.tab-bar::-webkit-scrollbar { height: 0; }
.tab-btn { flex: 0 0 auto; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6b8299; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: color 0.15s, border-color 0.15s; }
.tab-btn:hover { color: #a0bcd0; }
.tab-btn.active { color: #58cc02; border-bottom-color: #58cc02; }

/* Scrollable content */
.tab-content { flex: 1; overflow-y: auto; padding: 16px; }
.tab-content::-webkit-scrollbar { width: 4px; }
.tab-content::-webkit-scrollbar-thumb { background: #2a4055; border-radius: 2px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Section */
.section { margin-bottom: 20px; }
.section-header { font-size: 13px; font-weight: 700; color: #a0bcd0; margin-bottom: 10px; text-transform: none; letter-spacing: 0; }

/* Color swatches */
.swatch-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.12s, border-color 0.12s; position: relative; }
.swatch:hover { transform: scale(1.1); }
.swatch.selected { border-color: #58cc02; box-shadow: 0 0 0 2px rgba(88,204,2,0.3); }
.swatch.selected::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

/* Feature tiles */
.tile-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { width: 52px; height: 52px; border-radius: 10px; cursor: pointer; border: 2px solid #2a4055; background: #1e3347; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #a0bcd0; transition: all 0.12s; position: relative; }
.tile:hover { border-color: #58cc02; background: #1a3a2a; color: #fff; transform: scale(1.05); }
.tile.selected { border-color: #58cc02; background: #1a3a2a; color: #58cc02; box-shadow: 0 0 0 3px rgba(88,204,2,0.25); }
.tile.selected::after { content: '✓'; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; background: #58cc02; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.tile.zero-tile { border-style: dashed; }
.tile.zero-tile::before { content: '✕'; font-size: 18px; color: #4a6075; }

/* File picker */
.file-area { padding: 12px 20px; border-top: 1px solid #243647; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }
.file-area input[type="file"] { flex: 1; font-size: 11px; color: #6b8299; }
.file-area .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.file-area .status-dot.loaded { background: #58cc02; }
.file-area .status-dot.waiting { background: #ffc107; }

/* ---- Main canvas area ---- */
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #0f1a24; }
.canvas-wrap { position: relative; }
canvas { border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); background: #0f3460; max-width: 100%; height: auto; }
.main-actions { margin-top: 16px; display: flex; gap: 10px; }
.btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
.btn-primary { background: #58cc02; color: #fff; }
.btn-primary:hover { background: #4cb000; }
.btn-secondary { background: #2a4055; color: #a0bcd0; }
.btn-secondary:hover { background: #354f6a; }

/* Loading overlay */
.loading-overlay { position: fixed; inset: 0; background: rgba(15,26,36,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay.hidden { display: none; }
.spinner { width: 48px; height: 48px; border: 4px solid #2a4055; border-top-color: #58cc02; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #a0bcd0; }

.config-notice { font-size: 11px; color: #8b9f33; margin-top: 4px; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">加载 Avatar Builder...</div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>Avatar Builder</h1>
    <div class="subtitle" id="fileStatus">等待加载 .riv 文件...</div>
  </div>

  <div class="tab-bar" id="tabBar"></div>
  <div class="tab-content" id="tabContent"></div>

  <div class="file-area">
    <div class="status-dot waiting" id="statusDot"></div>
    <input type="file" id="fileInput" accept=".riv" title="选择 .riv 文件">
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="canvas-wrap">
    <canvas id="riveCanvas" width="500" height="500"></canvas>
  </div>
  <div class="main-actions">
    <button class="btn btn-primary" onclick="exportPNG()">导出 PNG</button>
    <button class="btn btn-secondary" onclick="resetAll()">重置默认</button>
  </div>
</div>

<script src="https://unpkg.com/@rive-app/canvas@2.37.8/rive.js"></script>
<script>
// ---- State ----
let riveInst = null;
let smNames = [];
let currentSM = '';
let triggerInput = null;   // bounce_trig ref
let fireTimeout = null;    // debounce timer
let builderConfig = null;  // avatar_builder_config.json
let currentInputValues = {}; // track current values per input name
let stateMachineInputs = {}; // name -> StateMachineInput object map

// ---- DOM refs ----
const canvas = document.getElementById('riveCanvas');
const tabBar = document.getElementById('tabBar');
const tabContent = document.getElementById('tabContent');
const loadingOverlay = document.getElementById('loadingOverlay');
const fileStatus = document.getElementById('fileStatus');
const statusDot = document.getElementById('statusDot');

// ---- Trigger scheduling ----
function scheduleTrigger() {
  if (!triggerInput) return;
  if (fireTimeout) clearTimeout(fireTimeout);
  fireTimeout = setTimeout(() => {
    triggerInput.fire();
    fireTimeout = null;
  }, 120);
}

// ---- Loading ----
function loadRiveFile(buffer) {
  if (riveInst) {
    try { riveInst.cleanup(); } catch(e) {}
    riveInst = null;
  }
  smNames = [];
  currentSM = '';
  stateMachineInputs = {};
  currentInputValues = {};

  const Rive = window.rive?.Rive;
  if (!Rive) { fileStatus.textContent = '错误: Rive SDK 未加载'; return; }

  fileStatus.textContent = '加载中...';
  riveInst = new Rive({
    canvas: canvas,
    buffer: new Uint8Array(buffer),
    autoplay: false,
    onLoad: () => onRiveLoaded(),
    onLoadError: (err) => fileStatus.textContent = `加载错误: ${err}`,
  });
}

function onRiveLoaded() {
  if (!riveInst) return;

  const file = riveInst.riveFile.file;
  const ab = file.defaultArtboard();
  const smCount = ab.stateMachineCount();

  smNames = [];
  for (let i = 0; i < smCount; i++) {
    smNames.push(ab.stateMachineByIndex(i).name);
  }

  fileStatus.textContent = `${ab.name} · ${ab.animationCount()} 动画 · ${smCount} 状态机`;
  statusDot.className = 'status-dot loaded';

  riveInst.play(smNames);

  // Defer: Animator needs frames to initialize
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      selectStateMachine('SMAvatar');
      loadingOverlay.classList.add('hidden');
    });
  });
}

function selectStateMachine(name) {
  if (!riveInst || !name) return;
  currentSM = name;

  const inputs = riveInst.stateMachineInputs(name);
  if (!inputs) {
    fileStatus.textContent = `stateMachineInputs('${name}') 返回 null`;
    return;
  }

  // Build name -> input map
  stateMachineInputs = {};
  currentInputValues = {};
  triggerInput = null;

  for (const inp of inputs) {
    stateMachineInputs[inp.name] = inp;
    if (inp.type === 58) { // Trigger
      if (inp.name === 'bounce_trig') triggerInput = inp;
    } else {
      currentInputValues[inp.name] = inp.value;
    }
  }

  if (builderConfig) renderUI();
}

// ---- Apply state machine value ----
function setSMValue(name, value) {
  const inp = stateMachineInputs[name];
  if (!inp) return;
  if (inp.type === 56) { // Number
    inp.value = value;
  } else if (inp.type === 59) { // Boolean
    inp.value = !!value;
  }
  currentInputValues[name] = value;
  scheduleTrigger();
}

function applyStatesToOverride(overrides) {
  for (const [name, value] of Object.entries(overrides)) {
    setSMValue(name, value);
  }
}

// ---- Build UI from config ----
function renderUI() {
  if (!builderConfig) return;

  const tabs = builderConfig.avatarBuilderConfig.stateChooserTabs;
  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  tabs.forEach((tab, ti) => {
    // Tab button
    const firstSection = tab.sections[0];
    const tabLabel = firstSection.header;
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = tabLabel;
    btn.onclick = () => switchTab(ti);
    tabBar.appendChild(btn);

    // Tab panel
    const panel = document.createElement('div');
    panel.className = 'tab-panel';

    for (const section of tab.sections) {
      const secDiv = document.createElement('div');
      secDiv.className = 'section';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = section.header;
      secDiv.appendChild(header);

      if (section.buttonType === 'IMAGE') {
        // Color swatch grid
        const grid = document.createElement('div');
        grid.className = 'swatch-grid';
        const stateName = section.imageButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const btn of section.imageButtons) {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          if (btn.value === currentVal) swatch.classList.add('selected');
          swatch.style.backgroundColor = btn.color;
          swatch.title = `${stateName}: ${btn.value}`;
          swatch.onclick = () => {
            setSMValue(btn.state, btn.value);
            // Update selection visual
            grid.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          };
          grid.appendChild(swatch);
        }
        secDiv.appendChild(grid);
      } else if (section.buttonType === 'FEATURE') {
        // Feature tile grid
        const grid = document.createElement('div');
        grid.className = 'tile-grid';
        const stateName = section.featureButtons[0]?.state;
        const currentVal = currentInputValues[stateName];

        for (const btn of section.featureButtons) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (btn.value === 0) tile.classList.add('zero-tile');
          if (btn.value === currentVal) tile.classList.add('selected');
          if (btn.value > 0) tile.textContent = btn.value;
          tile.title = `${stateName}: ${btn.value}`;
          tile.onclick = () => {
            applyStatesToOverride(btn.statesToOverride);
            // Update selection visuals within this section
            grid.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
            tile.classList.add('selected');
            // Also refresh color swatch highlights in other sections
            refreshAllHighlights();
          };
          grid.appendChild(tile);
        }
        secDiv.appendChild(grid);
      }

      panel.appendChild(secDiv);
    }

    tabContent.appendChild(panel);
  });

  // Activate first tab
  switchTab(0);
}

function switchTab(idx) {
  const btns = tabBar.querySelectorAll('.tab-btn');
  const panels = tabContent.querySelectorAll('.tab-panel');
  btns.forEach((b, i) => b.classList.toggle('active', i === idx));
  panels.forEach((p, i) => p.classList.toggle('active', i === idx));
}

function refreshAllHighlights() {
  // Re-render all swatch/tile highlights based on currentInputValues
  const panels = tabContent.querySelectorAll('.tab-panel');
  panels.forEach(panel => {
    panel.querySelectorAll('.swatch-grid').forEach(grid => {
      const swatches = grid.querySelectorAll('.swatch');
      const firstSwatch = swatches[0];
      if (!firstSwatch) return;
      const stateName = firstSwatch.title?.split(':')[0]?.trim();
      if (!stateName) return;
      const currentVal = currentInputValues[stateName];
      swatches.forEach(s => {
        const match = s.title?.match(new RegExp(`${stateName}:\\s*(\\d+)`));
        const val = match ? parseInt(match[1]) : null;
        s.classList.toggle('selected', val === currentVal);
      });
    });

    panel.querySelectorAll('.tile-grid').forEach(grid => {
      const tiles = grid.querySelectorAll('.tile');
      const firstTile = tiles[0];
      if (!firstTile) return;
      const stateName = firstTile.title?.split(':')[0]?.trim();
      if (!stateName) return;
      const currentVal = currentInputValues[stateName];
      tiles.forEach(t => {
        const match = t.title?.match(new RegExp(`${stateName}:\\s*(\\d+)`));
        const val = match ? parseInt(match[1]) : null;
        t.classList.toggle('selected', val === currentVal);
      });
    });
  });
}

// ---- Actions ----
function resetAll() {
  if (currentSM) selectStateMachine(currentSM);
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = `avatar_${currentSM || 'export'}_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ---- Events ----
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  loadRiveFile(buf);
});

// ---- Initialization ----
async function init() {
  // Load config
  try {
    const resp = await fetch('avatar_builder_config.json');
    if (resp.ok) {
      builderConfig = await resp.json();
      console.log('Config loaded:', builderConfig.avatarBuilderConfig.stateChooserTabs.length, 'tabs');
    }
  } catch(e) {
    console.warn('Config load failed:', e.message);
  }

  // Load Rive file
  try {
    const resp = await fetch('avatar_builder_25_sept2025.riv');
    if (resp.ok) {
      const buf = await resp.arrayBuffer();
      loadRiveFile(buf);
    } else {
      fileStatus.textContent = `HTTP ${resp.status}，请手动选择 .riv 文件`;
      loadingOverlay.classList.add('hidden');
    }
  } catch(e) {
    fileStatus.textContent = `请求失败: ${e.message}`;
    loadingOverlay.classList.add('hidden');
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
